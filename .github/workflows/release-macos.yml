# Globally disabled right now (even on Release creation/publish).
# To enable: remove `if: false` from each job below and run `gh workflow enable release-macos.yml`.
name: Release (macOS Only)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach build artifacts to"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-macos:
    if: false
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS .app, .dmg, and .zip
        run: bash scripts/package-macos.sh --release --target ${{ matrix.target }}

      - name: Stage macOS release artifacts
        run: |
          mkdir -p release-artifacts
          cp dist/macos-${{ matrix.arch }}/MIO-v*-macos-${{ matrix.arch }}.dmg release-artifacts/
          cp dist/macos-${{ matrix.arch }}/MIO-v*-macos-${{ matrix.arch }}.zip release-artifacts/

      - name: Upload macOS staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: mio-macos-${{ matrix.arch }}
          path: release-artifacts/*

  publish-release:
    if: false
    name: Upload macOS Artifacts & SHA256SUMS.txt
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum MIO-v* > SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" artifacts/* --clobber --repo "${{ github.repository }}"
