[package]
name = "mio-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
hex.workspace = true
md-5.workspace = true
mio-plugin-api = { path = "../mio-plugin-api" }
rama = { workspace = true, features = ["socks5", "ws"] }
rama-http-backend.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
tokio-util.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "client", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
bytes = "1.12.1"
