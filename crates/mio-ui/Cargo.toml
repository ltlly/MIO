[package]
name = "mio-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
encoding_rs.workspace = true
form_urlencoded.workspace = true
gpui-kit.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
imagesize = "0.14.0"
markdown = "1.0.0"
mio-core = { path = "../mio-core" }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSTimer", "block2", "objc2-core-foundation"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
